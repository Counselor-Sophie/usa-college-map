<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA College Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #sidebar {
      width: 320px;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }
    
    #sidebar-header {
      padding: 20px;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    
    #sidebar-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4facfe;
    }
    
    #search {
      width: 100%;
      padding: 10px 15px;
      margin-top: 15px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    #search:focus {
      border-color: #4facfe;
    }
    
    #college-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .college-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .college-item:hover {
      background: #1f3460;
      border-color: #4facfe;
    }
    
    .college-item.active {
      background: #1f3460;
      border-color: #4facfe;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
    }
    
    .college-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    
    .college-location {
      font-size: 0.8rem;
      color: #888;
    }
    
	    #map {
	      flex: 1;
	    }

	    .college-pin {
	      width: 16px;
	      height: 16px;
	      background: #e73c3c;
	      border: 2px solid #fff;
	      border-radius: 50% 50% 50% 0;
	      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
	      transform: rotate(-45deg);
	      transform-origin: center;
	      position: relative;
	      cursor: pointer;
	    }

	    .college-pin::after {
	      content: "";
	      position: absolute;
	      width: 6px;
	      height: 6px;
	      top: 3px;
	      left: 3px;
	      background: #fff;
	      border-radius: 50%;
	    }

	    .college-pin.active {
	      background: #4facfe;
	      box-shadow: 0 0 0 5px rgba(79, 172, 254, 0.22), 0 2px 10px rgba(0, 0, 0, 0.35);
	    }

	    .leaflet-popup-content-wrapper {
	      border-radius: 8px;
	    }
    
    .popup-name {
      font-weight: 600;
      font-size: 1rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    
    .popup-location {
      font-size: 0.85rem;
      color: #666;
    }
    
    .popup-stats {
      font-size: 0.8rem;
      color: #1a1a2e;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }
    
	    .popup-stats span {
	      display: block;
	      margin-bottom: 4px;
	    }

	    .popup-action {
	      color: #4facfe;
	      display: block;
	      font-size: 0.75rem;
	      font-weight: 600;
	      margin-top: 8px;
	    }
    
    #stats {
      padding: 15px 20px;
      background: #16213e;
      border-top: 1px solid #333;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>🎓 USA College Map</h1>
      <input type="text" id="search" placeholder="Search colleges...">
    </div>
    <div id="college-list"></div>
	    <div id="stats">Hover over pins for details</div>
  </div>
  <div id="map"></div>

  <script>
    // College data with coordinates and real acceptance rates from collegefit.counselorjay.com
    const colleges = [
      // Ivy League & Top Tier
      { name: "Harvard University", city: "Cambridge, MA", lat: 42.3770, lng: -71.1167, stats: { acceptance: "4%", sat: "1480-1590", act: "33-36", enrollment: "7,103" } },
      { name: "Stanford University", city: "Stanford, CA", lat: 37.4275, lng: -122.1697, stats: { acceptance: "3.9%", sat: "1520-1580", act: "34-36", enrollment: "7,645" } },
      { name: "MIT", city: "Cambridge, MA", lat: 42.3601, lng: -71.0942, stats: { acceptance: "<10%", sat: "1520-1580", act: "34-36", enrollment: "4,657" } },
      { name: "Yale University", city: "New Haven, CT", lat: 41.3163, lng: -72.9254, stats: { acceptance: "3.8%", sat: "1480-1580", act: "33-36", enrollment: "6,590" } },
      { name: "Princeton University", city: "Princeton, NJ", lat: 40.3440, lng: -74.6514, stats: { acceptance: "3.7%", sat: "1470-1570", act: "33-35", enrollment: "5,427" } },
      { name: "Columbia University", city: "New York, NY", lat: 40.8075, lng: -73.9626, stats: { acceptance: "3.7%", sat: "1450-1560", act: "33-35", enrollment: "8,832" } },
      { name: "University of Pennsylvania", city: "Philadelphia, PA", lat: 39.9493, lng: -75.1553, stats: { acceptance: "4.6%", sat: "1470-1560", act: "33-35", enrollment: "10,496" } },
      { name: "Brown University", city: "Providence, RI", lat: 41.8268, lng: -71.4025, stats: { acceptance: "5.65%", sat: "1480-1570", act: "33-35", enrollment: "6,648" } },
      { name: "Duke University", city: "Durham, NC", lat: 36.0010, lng: -78.9382, stats: { acceptance: "6%", sat: "1480-1570", act: "33-35", enrollment: "6,609" } },
      { name: "Northwestern University", city: "Evanston, IL", lat: 42.0565, lng: -87.6753, stats: { acceptance: "~6%", sat: "1470-1560", act: "33-35", enrollment: "8,231" } },
      { name: "University of Chicago", city: "Chicago, IL", lat: 41.7886, lng: -87.5987, stats: { acceptance: "~5%", sat: "1510-1580", act: "33-35", enrollment: "6,906" } },
      { name: "Caltech", city: "Pasadena, CA", lat: 34.1377, lng: -118.1253, stats: { acceptance: "~4%", sat: "1530-1590", act: "35-36", enrollment: "892" } },
      { name: "Johns Hopkins University", city: "Baltimore, MD", lat: 39.3299, lng: -76.6205, stats: { acceptance: "~6%", sat: "1470-1560", act: "33-35", enrollment: "6,256" } },
      { name: "Cornell University", city: "Ithaca, NY", lat: 42.4534, lng: -76.4735, stats: { acceptance: "8.4%", sat: "1450-1560", act: "32-35", enrollment: "15,503" } },
      { name: "Rice University", city: "Houston, TX", lat: 29.7174, lng: -95.4018, stats: { acceptance: "~6%", sat: "1490-1570", act: "34-36", enrollment: "4,050" } },
      { name: "Vanderbilt University", city: "Nashville, TN", lat: 36.1447, lng: -86.8027, stats: { acceptance: "~6%", sat: "1470-1560", act: "33-35", enrollment: "6,886" } },
      { name: "University of Notre Dame", city: "Notre Dame, IN", lat: 41.7055, lng: -86.2353, stats: { acceptance: "9%", sat: "1450-1550", act: "33-35", enrollment: "8,874" } },
      { name: "Georgetown University", city: "Washington, DC", lat: 38.9076, lng: -77.0723, stats: { acceptance: "~13%", sat: "1410-1550", act: "31-34", enrollment: "7,459" } },
      // UC Schools
      { name: "UC Berkeley", city: "Berkeley, CA", lat: 37.8716, lng: -122.2727, stats: { acceptance: "~11%" } },
      { name: "UCLA", city: "Los Angeles, CA", lat: 34.0689, lng: -118.4452, stats: { acceptance: "~3%" } },
      { name: "UC San Diego", city: "La Jolla, CA", lat: 32.8801, lng: -117.2379, stats: { acceptance: "~24%" } },
      { name: "UC Santa Barbara", city: "Santa Barbara, CA", lat: 34.4140, lng: -119.8489, stats: { acceptance: "~26%" } },
      { name: "UC Davis", city: "Davis, CA", lat: 38.5816, lng: -121.4944, stats: { acceptance: "~37%" } },
      { name: "UC Irvine", city: "Irvine, CA", lat: 33.6405, lng: -117.8443, stats: { acceptance: "~21%" } },
      // Other Top Public & Private
      { name: "University of Michigan", city: "Ann Arbor, MI", lat: 42.2780, lng: -83.7382, stats: { acceptance: "16.4%" } },
      { name: "University of Virginia", city: "Charlottesville, VA", lat: 38.0336, lng: -78.5080, stats: { acceptance: "~23%" } },
      { name: "Carnegie Mellon University", city: "Pittsburgh, PA", lat: 40.4443, lng: -79.9608, stats: { acceptance: "~13%" } },
      { name: "Emory University", city: "Atlanta, GA", lat: 33.7930, lng: -84.3134, stats: { acceptance: "~13%" } },
      { name: "USC", city: "Los Angeles, CA", lat: 34.0224, lng: -118.2851, stats: { acceptance: "11.2%" } },
      { name: "NYU", city: "New York, NY", lat: 40.7295, lng: -73.9965, stats: { acceptance: "6-8%" } },
      { name: "University of North Carolina", city: "Chapel Hill, NC", lat: 35.9049, lng: -79.0469, stats: { acceptance: "~17%" } },
      { name: "University of Georgia", city: "Athens, GA", lat: 33.9480, lng: -83.3773, stats: { acceptance: "~56%" } },
      { name: "University of Texas at Austin", city: "Austin, TX", lat: 30.2849, lng: -97.7341, stats: { acceptance: "~31%" } },
      { name: "University of Florida", city: "Gainesville, FL", lat: 29.6436, lng: -82.3549, stats: { acceptance: "~13%" } },
      { name: "University of Washington", city: "Seattle, WA", lat: 47.6553, lng: -122.3035, stats: { acceptance: "~48%" } },
      { name: "Ohio State University", city: "Columbus, OH", lat: 40.0067, lng: -83.0305, stats: { acceptance: "~51%" } },
      { name: "University of Wisconsin", city: "Madison, WI", lat: 43.0766, lng: -89.4125, stats: { acceptance: "~51%" } },
      { name: "University of Arizona", city: "Tucson, AZ", lat: 32.2319, lng: -110.9501, stats: { acceptance: "~87%" } },
      // Other Schools
      { name: "Boston University", city: "Boston, MA", lat: 42.3505, lng: -71.1054, stats: { acceptance: "~11%" } },
      { name: "Tulane University", city: "New Orleans, LA", lat: 29.9399, lng: -90.1209, stats: { acceptance: "~11%" } },
      { name: "University of Miami", city: "Miami, FL", lat: 25.7181, lng: -80.2793, stats: { acceptance: "~19%" } },
      { name: "Pepperdine University", city: "Malibu, CA", lat: 34.0392, lng: -118.7065, stats: { acceptance: "~31%" } },
      { name: "Villanova University", city: "Villanova, PA", lat: 40.0357, lng: -75.3385, stats: { acceptance: "~23%" } },
      { name: "Boston College", city: "Chestnut Hill, MA", lat: 42.3355, lng: -71.1685, stats: { acceptance: "13.9%" } },
      { name: "Tufts University", city: "Medford, MA", lat: 42.4045, lng: -71.1198, stats: { acceptance: "~10%" } },
      { name: "Northeastern University", city: "Boston, MA", lat: 42.3398, lng: -71.0892, stats: { acceptance: "~7%" } },
      { name: "Wake Forest University", city: "Winston-Salem, NC", lat: 36.1337, lng: -80.2754, stats: { acceptance: "~21%" } },
      { name: "George Washington University", city: "Washington, DC", lat: 38.8997, lng: -77.0486, stats: { acceptance: "~13%" } },
      { name: "University of Rochester", city: "Rochester, NY", lat: 43.1285, lng: -77.6268, stats: { acceptance: "~37%" } },
      { name: "Case Western Reserve", city: "Cleveland, OH", lat: 41.5025, lng: -81.6739, stats: { acceptance: "~27%" } },
      { name: "Lehigh University", city: "Bethlehem, PA", lat: 40.6075, lng: -75.3776, stats: { acceptance: "~25%" } },
      { name: "University of Colorado Boulder", city: "Boulder, CO", lat: 40.0076, lng: -105.2659, stats: { acceptance: "~79%" } },
      { name: "University of Utah", city: "Salt Lake City, UT", lat: 40.7649, lng: -111.8421, stats: { acceptance: "~89%" } },
      { name: "Brigham Young University", city: "Provo, UT", lat: 40.2523, lng: -111.6493, stats: { acceptance: "~67%" } },
      // Hawaii Colleges
      { name: "University of Hawaii at Manoa", city: "Honolulu, HI", lat: 21.3069, lng: -157.8212, stats: { acceptance: "~64%" } },
      { name: "Hawaii Pacific University", city: "Honolulu, HI", lat: 21.3093, lng: -157.8623, stats: { acceptance: "~57%" } },
      // Alaska Colleges
      { name: "University of Alaska Anchorage", city: "Anchorage, AK", lat: 61.1922, lng: -149.8924, stats: { acceptance: "~68%" } },
      { name: "University of Alaska Fairbanks", city: "Fairbanks, AK", lat: 64.8438, lng: -147.7339, stats: { acceptance: "~56%" } }
    ];

	    // Start at a national view so students can compare regions before zooming in.
	    const usaView = {
	      center: [39.8283, -113.0],
	      zoom: 3
	    };

	    const map = L.map('map', {
	      zoomControl: true,
	      dragging: true,
	      scrollWheelZoom: true,
	      doubleClickZoom: true,
	      boxZoom: true,
	      keyboard: true,
	      touchZoom: true,
	      minZoom: usaView.zoom,
	      maxZoom: 19
	    }).setView(usaView.center, usaView.zoom);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

	    const markers = {};
	    const listEl = document.getElementById('college-list');
	    const searchEl = document.getElementById('search');
	    const statsEl = document.getElementById('stats');
	    let activeCollege = null;

	    const profilePaths = {
	      "Harvard University": "harvard.html",
	      "Stanford University": "stanford.html",
	      "MIT": "mit.html",
	      "Yale University": "yale.html",
	      "Princeton University": "princeton.html",
	      "Columbia University": "columbia.html",
	      "University of Pennsylvania": "upenn.html",
	      "Brown University": "brown.html",
	      "Duke University": "duke.html",
	      "Northwestern University": "northwestern.html",
	      "University of Chicago": "uchicago.html",
	      "Caltech": "caltech.html",
	      "Johns Hopkins University": "johns-hopkins.html",
	      "Cornell University": "cornell.html",
	      "Rice University": "rice.html",
	      "Vanderbilt University": "vanderbilt.html",
	      "University of Notre Dame": "notre-dame.html",
	      "Georgetown University": "georgetown.html",
	      "UC Berkeley": "uc-berkeley.html",
	      "UCLA": "ucla.html",
	      "UC San Diego": "uc-san-diego.html",
	      "UC Santa Barbara": "uc-santa-barbara.html",
	      "UC Davis": "uc-davis.html",
	      "UC Irvine": "uc-irvine.html",
	      "University of Michigan": "umich.html",
	      "University of Virginia": "uva.html",
	      "Carnegie Mellon University": "carnegie-mellon.html",
	      "Emory University": "emory.html",
	      "USC": "usc.html",
	      "NYU": "nyu.html",
	      "University of North Carolina": "unc-chapel-hill.html",
	      "University of Georgia": "uga.html",
	      "University of Texas at Austin": "ut-austin.html",
	      "University of Florida": "uf.html",
	      "University of Washington": "uw.html",
	      "Ohio State University": "ohio-state.html",
	      "University of Wisconsin": "uw-madison.html",
	      "Boston University": "boston-university.html",
	      "Boston College": "boston-college.html",
	      "Tufts University": "tufts.html",
	      "Wake Forest University": "wake-forest.html",
	      "University of Rochester": "rochester.html",
	      "Lehigh University": "lehigh.html"
	    };

	    function getProfileUrl(college) {
	      const path = profilePaths[college.name];
	      return path ? `https://collegefit.counselorjay.com/${path}` : null;
	    }

	    function buildPopupContent(college) {
	      const stats = college.stats;
	      let statsHtml = `<span><b>Acceptance:</b> ${stats.acceptance || 'N/A'}</span>`;
	      if (stats.sat) statsHtml += `<span><b>SAT:</b> ${stats.sat}</span>`;
	      if (stats.act) statsHtml += `<span><b>ACT:</b> ${stats.act}</span>`;
	      if (stats.enrollment) statsHtml += `<span><b>Enrollment:</b> ${stats.enrollment}</span>`;
	      const action = getProfileUrl(college)
	        ? "Click pin for full profile"
	        : "Profile coming soon";

	      return `
	        <div class="popup-name">${college.name}</div>
	        <div class="popup-location">${college.city}</div>
	        <div class="popup-stats">
	          ${statsHtml}
	          <span class="popup-action">${action}</span>
	        </div>
	      `;
	    }

	    function setActiveCollege(college) {
	      activeCollege = college;

	      document.querySelectorAll('.college-item').forEach(itemEl => {
	        const itemName = itemEl.querySelector('.college-name').innerText;
	        itemEl.classList.toggle('active', itemName === college.name);
	      });

	      Object.values(markers).forEach(marker => {
	        const markerEl = marker.getElement();
	        const pinEl = markerEl && markerEl.querySelector('.college-pin');
	        if (pinEl) pinEl.classList.remove('active');
	      });

	      const marker = markers[college.name];
	      const markerEl = marker && marker.getElement();
	      const pinEl = markerEl && markerEl.querySelector('.college-pin');
	      if (pinEl) pinEl.classList.add('active');
	    }

	    function showCollegePopup(college) {
	      setActiveCollege(college);
	      markers[college.name].openPopup();
	      statsEl.innerText = `${college.name} is in ${college.city}.`;
	    }

	    function openCollegeProfile(college) {
	      const profileUrl = getProfileUrl(college);
	      if (profileUrl) {
	        window.open(profileUrl, '_blank', 'noopener');
	      } else {
	        showCollegePopup(college);
	        statsEl.innerText = `${college.name} profile is coming soon.`;
	      }
	    }

	    const pinIcon = L.divIcon({
	      className: '',
	      html: '<div class="college-pin"></div>',
	      iconSize: [18, 24],
	      iconAnchor: [9, 23],
	      popupAnchor: [0, -22]
	    });

	    colleges.forEach(college => {
	      const marker = L.marker([college.lat, college.lng], {
	        icon: pinIcon,
	        title: college.name,
	        riseOnHover: true
	      }).addTo(map);

	      marker.bindPopup(buildPopupContent(college), {
	        maxWidth: 260,
	        closeButton: false,
	        autoPan: false
	      });

	      marker.on('mouseover', () => showCollegePopup(college));
	      marker.on('focus', () => showCollegePopup(college));
	      marker.on('click', () => openCollegeProfile(college));
	      markers[college.name] = marker;
	    });

    // Render college list
    function renderList(filter = '') {
      listEl.innerHTML = '';
      const filtered = colleges.filter(c => 
        c.name.toLowerCase().includes(filter.toLowerCase()) ||
        c.city.toLowerCase().includes(filter.toLowerCase())
      );
      
	      filtered.forEach(college => {
	        const div = document.createElement('div');
	        div.className = `college-item${activeCollege && activeCollege.name === college.name ? ' active' : ''}`;
        div.innerHTML = `
          <div class="college-name">${college.name}</div>
          <div class="college-location">${college.city}</div>
        `;
	        div.addEventListener('mouseenter', () => showCollegePopup(college));
	        div.addEventListener('click', () => showCollegePopup(college));
	        listEl.appendChild(div);
	      });
	      statsEl.innerText = activeCollege
	        ? `${filtered.length} colleges match. ${activeCollege.name} selected.`
	        : `${filtered.length} colleges shown. Hover over a pin for details.`;
	    }

    // Search functionality
    searchEl.addEventListener('input', (e) => {
      renderList(e.target.value);
    });

    // Initial render
    renderList();
  </script>
</body>
</html>
