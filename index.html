<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA College Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #sidebar {
      width: 320px;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }
    
    #sidebar-header {
      padding: 20px;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    
    #sidebar-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4facfe;
    }
    
    #search {
      width: 100%;
      padding: 10px 15px;
      margin-top: 15px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    #search:focus {
      border-color: #4facfe;
    }
    
    #college-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .college-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .college-item:hover {
      background: #1f3460;
      border-color: #4facfe;
    }
    
    .college-item.active {
      background: #1f3460;
      border-color: #4facfe;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
    }
    
    .college-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    
    .college-location {
      font-size: 0.8rem;
      color: #888;
    }
    
    #map {
      flex: 1;
    }
    
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
    }
    
    .popup-name {
      font-weight: 600;
      font-size: 1rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    
    .popup-location {
      font-size: 0.85rem;
      color: #666;
    }
    
    #stats {
      padding: 15px 20px;
      background: #16213e;
      border-top: 1px solid #333;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>🎓 USA College Map</h1>
      <input type="text" id="search" placeholder="Search colleges...">
    </div>
    <div id="college-list"></div>
    <div id="stats">Click a college to locate</div>
  </div>
  <div id="map"></div>

  <script>
    // College data with coordinates
    const colleges = [
      { name: "Harvard University", city: "Cambridge, MA", lat: 42.3770, lng: -71.1167 },
      { name: "Stanford University", city: "Stanford, CA", lat: 37.4275, lng: -122.1697 },
      { name: "MIT", city: "Cambridge, MA", lat: 42.3601, lng: -71.0942 },
      { name: "Yale University", city: "New Haven, CT", lat: 41.3163, lng: -72.9254 },
      { name: "Princeton University", city: "Princeton, NJ", lat: 40.3440, lng: -74.6514 },
      { name: "Columbia University", city: "New York, NY", lat: 40.8075, lng: -73.9626 },
      { name: "University of Pennsylvania", city: "Philadelphia, PA", lat: 39.9493, lng: -75.1553 },
      { name: "Brown University", city: "Providence, RI", lat: 41.8268, lng: -71.4025 },
      { name: "Duke University", city: "Durham, NC", lat: 36.0010, lng: -78.9382 },
      { name: "Northwestern University", city: "Evanston, IL", lat: 42.0565, lng: -87.6753 },
      { name: "University of Chicago", city: "Chicago, IL", lat: 41.7886, lng: -87.5987 },
      { name: "Caltech", city: "Pasadena, CA", lat: 34.1377, lng: -118.1253 },
      { name: "Johns Hopkins University", city: "Baltimore, MD", lat: 39.3299, lng: -76.6205 },
      { name: "Cornell University", city: "Ithaca, NY", lat: 42.4534, lng: -76.4735 },
      { name: "Rice University", city: "Houston, TX", lat: 29.7174, lng: -95.4018 },
      { name: "Vanderbilt University", city: "Nashville, TN", lat: 36.1447, lng: -86.8027 },
      { name: "University of Notre Dame", city: "Notre Dame, IN", lat: 41.7055, lng: -86.2353 },
      { name: "Georgetown University", city: "Washington, DC", lat: 38.9076, lng: -77.0723 },
      { name: "University of California, Berkeley", city: "Berkeley, CA", lat: 37.8716, lng: -122.2727 },
      { name: "UCLA", city: "Los Angeles, CA", lat: 34.0689, lng: -118.4452 },
      { name: "University of Michigan", city: "Ann Arbor, MI", lat: 42.2780, lng: -83.7382 },
      { name: "University of Virginia", city: "Charlottesville, VA", lat: 38.0336, lng: -78.5080 },
      { name: "Carnegie Mellon University", city: "Pittsburgh, PA", lat: 40.4443, lng: -79.9608 },
      { name: "Emory University", city: "Atlanta, GA", lat: 33.7930, lng: -84.3134 },
      { name: "University of Southern California", city: "Los Angeles, CA", lat: 34.0224, lng: -118.2851 },
      { name: "NYU", city: "New York, NY", lat: 40.7295, lng: -73.9965 },
      { name: "University of North Carolina", city: "Chapel Hill, NC", lat: 35.9049, lng: -79.0469 },
      { name: "University of Georgia", city: "Athens, GA", lat: 33.9480, lng: -83.3773 },
      { name: "University of Texas at Austin", city: "Austin, TX", lat: 30.2849, lng: -97.7341 },
      { name: "University of Florida", city: "Gainesville, FL", lat: 29.6436, lng: -82.3549 },
      { name: "University of Washington", city: "Seattle, WA", lat: 47.6553, lng: -122.3035 },
      { name: "Ohio State University", city: "Columbus, OH", lat: 40.0067, lng: -83.0305 },
      { name: "University of Wisconsin", city: "Madison, WI", lat: 43.0766, lng: -89.4125 },
      { name: "University of Arizona", city: "Tucson, AZ", lat: 32.2319, lng: -110.9501 },
      { name: "Boston University", city: "Boston, MA", lat: 42.3505, lng: -71.1054 },
      { name: "Tulane University", city: "New Orleans, LA", lat: 29.9399, lng: -90.1209 },
      { name: "University of Miami", city: "Miami, FL", lat: 25.7181, lng: -80.2793 },
      { name: "Pepperdine University", city: "Malibu, CA", lat: 34.0392, lng: -118.7065 },
      { name: "Villanova University", city: "Villanova, PA", lat: 40.0357, lng: -75.3385 },
      { name: "Boston College", city: "Chestnut Hill, MA", lat: 42.3355, lng: -71.1685 },
      { name: "Tufts University", city: "Medford, MA", lat: 42.4045, lng: -71.1198 },
      { name: "Northeastern University", city: "Boston, MA", lat: 42.3398, lng: -71.0892 },
      { name: "Wake Forest University", city: "Winston-Salem, NC", lat: 36.1337, lng: -80.2754 },
      { name: "George Washington University", city: "Washington, DC", lat: 38.8997, lng: -77.0486 },
      { name: "University of Rochester", city: "Rochester, NY", lat: 43.1285, lng: -77.6268 },
      { name: "Case Western Reserve", city: "Cleveland, OH", lat: 41.5025, lng: -81.6739 },
      { name: "Lehigh University", city: "Bethlehem, PA", lat: 40.6075, lng: -75.3776 },
      { name: "University of Colorado Boulder", city: "Boulder, CO", lat: 40.0076, lng: -105.2659 },
      { name: "University of Utah", city: "Salt Lake City, UT", lat: 40.7649, lng: -111.8421 },
      { name: "Brigham Young University", city: "Provo, UT", lat: 40.2523, lng: -111.6493 }
    ];

    // Initialize map
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const markers = {};
    const listEl = document.getElementById('college-list');
    const searchEl = document.getElementById('search');

    // Render college list
    function renderList(filter = '') {
      listEl.innerHTML = '';
      const filtered = colleges.filter(c => 
        c.name.toLowerCase().includes(filter.toLowerCase()) ||
        c.city.toLowerCase().includes(filter.toLowerCase())
      );
      
      filtered.forEach(college => {
        const div = document.createElement('div');
        div.className = 'college-item';
        div.innerHTML = `
          <div class="college-name">${college.name}</div>
          <div class="college-location">${college.city}</div>
        `;
        div.addEventListener('click', () => flyToCollege(college));
        listEl.appendChild(div);
      });
    }

    // Fly to college and show popup
    function flyToCollege(college) {
      // Update active state
      document.querySelectorAll('.college-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.college-item').classList.add('active');
      
      // Fly to location
      map.flyTo([college.lat, college.lng], 10, {
        duration: 1.5
      });
      
      // Show popup
      setTimeout(() => {
        const popup = L.popup()
          .setLatLng([college.lat, college.lng])
          .setContent(`
            <div class="popup-name">${college.name}</div>
            <div class="popup-location">${college.city}</div>
          `)
          .openOn(map);
      }, 1600);
    }

    // Search functionality
    searchEl.addEventListener('input', (e) => {
      renderList(e.target.value);
    });

    // Initial render
    renderList();
  </script>
</body>
</html>
