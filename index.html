  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #sidebar {
      width: 320px;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }
    
    #sidebar-header {
      padding: 20px;
      background: #16213e;
      border-bottom: 1px solid #333;
    }
    
    #sidebar-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4facfe;
    }
    
    #search {
      width: 100%;
      padding: 10px 15px;
      margin-top: 15px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    #search:focus {
      border-color: #4facfe;
    }
    
    #college-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .college-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .college-item:hover {
      background: #1f3460;
      border-color: #4facfe;
    }
    
    .college-item.active {
      background: #1f3460;
      border-color: #4facfe;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
    }
    
    .college-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    
    .college-location {
      font-size: 0.8rem;
      color: #888;
    }
    
    #map {
      flex: 1;
    }
    
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
    }
    
    .popup-name {
      font-weight: 600;
      font-size: 1rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    
    .popup-location {
      font-size: 0.85rem;
      color: #666;
    }
    
    .popup-stats {
      font-size: 0.8rem;
      color: #1a1a2e;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }
    
    .popup-stats span {
      display: block;
      margin-bottom: 4px;
    }
    
    #stats {
      padding: 15px 20px;
      background: #16213e;
      border-top: 1px solid #333;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>

      { name: "University of Hawaii at Manoa", city: "Honolulu, HI", lat: 21.3069, lng: -157.8212, stats: { acceptance: "64.0%", tuition: "$35,000" } },

      { name: "University of Alaska Anchorage", city: "Anchorage, AK", lat: 61.1922, lng: -149.8924, stats: { acceptance: "68.0%", tuition: "$30,000" } },

    // Initialize map to show full USA view (including AK and HI)
    const map = L.map('map').setView([39.8283, -113.0], 3); // Adjusted center and zoom for full US view

      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const markers = {};
    const listEl = document.getElementById('college-list');
    const searchEl = document.getElementById('search');
    const statsEl = document.getElementById('stats');
    let activeMarker = null;

    // Render college list
    function renderList(filter = '') {
      listEl.innerHTML = '';
      const filtered = colleges.filter(c => 
        c.name.toLowerCase().includes(filter.toLowerCase()) ||
        c.city.toLowerCase().includes(filter.toLowerCase())
      );
      
      filtered.forEach(college => {
        const div = document.createElement('div');
        div.className = 'college-item';
        div.innerHTML = `
          <div class="college-name">${college.name}</div>
          <div class="college-location">${college.city}</div>
        `;
        div.addEventListener('click', () => focusOnCollege(college));
        listEl.appendChild(div);
      });
      statsEl.innerText = `Found ${filtered.length} colleges. Click one to locate.`;
    }

    // Focus on college and show popup
    function focusOnCollege(college) {
      // Update active state in list
      document.querySelectorAll('.college-item').forEach(el => el.classList.remove('active'));
      // Find the clicked item and mark it active (this requires careful DOM traversal or passing the element)
      // For simplicity, we'll re-query for the element that matches the college name
      document.querySelectorAll('.college-item').forEach(itemEl => {
        if (itemEl.querySelector('.college-name').innerText === college.name) {
          itemEl.classList.add('active');
        }
      });
      
      // Fly to location
      map.flyTo([college.lat, college.lng], college.name.includes("University of Hawaii") || college.name.includes("Hawaii Pacific") || college.name.includes("University of Alaska") ? 6 : 10, { // Zoom level for Hawaii/Alaska
        duration: 1.5
      });
      
      // Show popup
      setTimeout(() => {
        const popupContent = `
          <div class="popup-name">${college.name}</div>
          <div class="popup-location">${college.city}</div>
          <div class="popup-stats">
            <span><b>Acceptance Rate:</b> ${college.stats.acceptance || 'N/A'}</span>
            <span><b>Tuition:</b> ${college.stats.tuition || 'N/A'}</span>
          </div>
        `;
        const popup = L.popup({ maxWidth: 300 }) // Set popup max width
          .setLatLng([college.lat, college.lng])
          .setContent(popupContent)
          .openOn(map);
        activeMarker = popup; // Keep track of the active popup
      }, 1600);
    }

    // Search functionality
    searchEl.addEventListener('input', (e) => {
      renderList(e.target.value);
    });

    // Initial render
    renderList();
